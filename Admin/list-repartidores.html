<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Repartidores | Tienda MASS</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet" />
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
</head>

<body>
  <!-- Navbar -->
  <div id="navbar-top"></div>

  <div id="layoutSidenav">
    <!-- Sidebar -->
    <div id="layoutSidenav_nav"></div>

    <div id="layoutSidenav_content">
      <main>
        <div class="container-fluid px-4">
          <h1 class="mt-4">Repartidores</h1>
          <hr>
          <div class="row">
            <div class="col-md-12">
              <div class="card">
                <div class="card-header">
                  <h4>Registro de Repartidores
                    <button type="button" class="btn btn-primary float-end" data-bs-toggle="modal" data-bs-target="#exampleModal">
                      Agregar Nuevo
                    </button>
                  </h4>
                </div>
                <div class="card-body">
                  <table id="tabla-repartidores" class="table table-bordered text-center">
                    <thead>
                      <tr>
                        <th>ID</th>
                        <th>Nombre</th>
                        <th>Correo</th>
                        <th>Contraseña</th>
                        <th>Teléfono</th>
                        <th>Acción</th>
                      </tr>
                    </thead>
                    <tbody></tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </main>

      <!-- Footer -->
      <footer class="py-4 bg-light mt-auto">
        <div class="container-fluid px-4">
          <div class="d-flex align-items-center justify-content-between small">
            <div class="text-muted">© Tienda MASS 2025</div>
          </div>
        </div>
      </footer>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="exampleModal" tabindex="-1" aria-labelledby="exampleModalLabel" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="exampleModalLabel">Nuevo Repartidor</h5>
        </div>
        <div class="modal-body">
          <form id="form-repartidor" class="row g-3">
            <input type="hidden" id="txt-id" />
            <div class="col-12">
              <label class="form-label">Nombre</label>
              <input type="text" class="form-control" id="txt-nombre" required>
            </div>
            <div class="col-12">
              <label class="form-label">Correo</label>
              <input type="email" class="form-control" id="txt-correo" required>
            </div>
            <div class="col-12">
              <label class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="txt-telefono" required>
            </div>
            <div class="col-12">
              <label class="form-label">Contraseña</label>
              <input type="password" class="form-control" id="txt-contrasena" required>
            </div>
            <div class="modal-footer">
              <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
              <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    fetch('includes/navbar-top.html')
      .then(res => res.text())
      .then(html => document.getElementById('navbar-top').innerHTML = html);

    fetch('includes/sidebar.html')
      .then(res => res.text())
      .then(html => document.getElementById('layoutSidenav_nav').innerHTML = html);
  </script>

  <!-- ✅ Script principal funcional -->
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const tbody = document.querySelector('#tabla-repartidores tbody');

    function cargarRepartidores() {
      fetch('http://localhost:8080/api/repartidores')
        .then(res => res.json())
        .then(data => {
          tbody.innerHTML = '';
          data.forEach(r => {
            tbody.innerHTML += `
              <tr>
                <td>${r.id}</td>
                <td>${r.nombre}</td>
                <td>${r.correo}</td>
                <td>${'*'.repeat(r.contrasena.length)}</td>
                <td>${r.telefono || '-'}</td>
                <td>
                  <button class="btn btn-success btn-editar" 
                    data-id="${r.id}" 
                    data-nombre="${r.nombre}"
                    data-correo="${r.correo}"
                    data-telefono="${r.telefono}"
                    data-contrasena="${r.contrasena}">
                    Editar
                  </button>
                  <button class="btn btn-danger btn-eliminar" data-id="${r.id}">Eliminar</button>
                </td>
              </tr>
            `;
          });

          // Botones editar
          document.querySelectorAll('.btn-editar').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-id');
              document.getElementById('txt-id').value = id;
              document.getElementById('txt-nombre').value = btn.getAttribute('data-nombre');
              document.getElementById('txt-correo').value = btn.getAttribute('data-correo');
              document.getElementById('txt-telefono').value = btn.getAttribute('data-telefono');
              document.getElementById('txt-contrasena').value = btn.getAttribute('data-contrasena');

              const modal = new bootstrap.Modal(document.getElementById('exampleModal'));
              modal.show();
            });
          });

          // Botones eliminar
          document.querySelectorAll('.btn-eliminar').forEach(btn => {
            btn.addEventListener('click', () => {
              const id = btn.getAttribute('data-id');
              if (confirm('¿Estás seguro de eliminar este repartidor?')) {
                fetch(`http://localhost:8080/api/repartidores/${id}`, {
                  method: 'DELETE'
                }).then(() => {
                  alert('Repartidor eliminado');
                  cargarRepartidores();
                });
              }
            });
          });
        });
    }

    cargarRepartidores();

    // Guardar o editar con validaciones
    document.getElementById('form-repartidor').addEventListener('submit', function (e) {
      e.preventDefault();

      const id = document.getElementById('txt-id').value;
      const nombre = document.getElementById('txt-nombre').value.trim();
      const correo = document.getElementById('txt-correo').value.trim();
      const telefono = document.getElementById('txt-telefono').value.trim();
      const contrasena = document.getElementById('txt-contrasena').value;

      // ✅ VALIDACIONES
      const soloLetrasRegex = /^[A-Za-zÁÉÍÓÚáéíóúñÑ\s]+$/;
      if (!soloLetrasRegex.test(nombre)) {
        alert('El nombre no debe contener números ni caracteres especiales.');
        return;
      }

      if (!/^\d{6,15}$/.test(telefono)) {
        alert('El teléfono debe contener solo números (de 6 a 15 dígitos).');
        return;
      }

      if (!correo.includes('@') || !correo.includes('.')) {
        alert('Ingrese un correo válido.');
        return;
      }

      if (contrasena.length < 4) {
        alert('La contraseña debe tener al menos 4 caracteres.');
        return;
      }

      // Crear objeto repartidor
      const repartidor = { nombre, correo, telefono, contrasena };
      const metodo = id ? 'PUT' : 'POST';
      const url = id 
        ? `http://localhost:8080/api/repartidores/${id}` 
        : 'http://localhost:8080/api/repartidores';

      fetch(url, {
        method: metodo,
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(repartidor)
      })
      .then(res => {
        if (!res.ok) throw new Error('Error al guardar');
        return res.json();
      })
      .then(() => {
        alert('Repartidor guardado correctamente');
        document.getElementById('form-repartidor').reset();
        document.getElementById('txt-id').value = '';
        const modal = bootstrap.Modal.getInstance(document.getElementById('exampleModal'));
        modal.hide();
        cargarRepartidores();
      })
      .catch(err => {
        console.error('Error:', err);
        alert('Error al guardar repartidor');
      });
    });
  });
</script>

  <scrip>
    
  </scrip>
</body>
</html>
