<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <title>Ventas | Tienda Mass</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Estilos -->
  <link href="css/styles.css" rel="stylesheet" />
  <link href="css/jquery.dataTables.min.css" rel="stylesheet" />
  <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
  <style>
    .btn-filtrar {
      margin: 0 5px 15px 0;
    }

    .img-evidencia {
      width: 80px;
      cursor: zoom-in;
      border-radius: 4px;
    }

    .modal-body img {
      width: 100%;
    }
  </style>
</head>

<body>
  <div id="navbar-top"></div>
  <div id="layoutSidenav">
    <div id="layoutSidenav_nav"></div>
    <div id="layoutSidenav_content">
      <main>
        <div class="container-fluid px-4">
          <h1 class="mt-4">Registro de Ventas</h1>
          <hr>

          <div class="d-flex justify-content-end">
            <button class="btn btn-primary btn-filtrar" onclick="filtrar('todos')">Todos</button>
            <button class="btn btn-success btn-filtrar" onclick="filtrar('enviado')">Entregados</button>
            <button class="btn btn-warning btn-filtrar" onclick="filtrar('pendiente')">Pendientes</button>
          </div>

          <div class="card">
            <div class="card-header">
              <h4>Registros de Ventas</h4>
            </div>
            <div class="card-body">
              <table class="table table-bordered text-center">
                <thead>
                  <tr>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Productos</th>
                    <th>Dirección</th>
                    <th>Método de Pago</th>
                    <th>Correo</th>
                    <th>Estado</th>
                    <th>Fecha Deseada</th>
                    <th>Evidencia</th>
                  </tr>
                </thead>
                <tbody id="tablaVentas"></tbody>
              </table>
            </div>
          </div>
        </div>
      </main>
      <div data-include="includes/footer.html"></div>
    </div>
  </div>

  <!-- Modal Zoom -->
  <div class="modal fade" id="zoomModal" tabindex="-1">
    <div class="modal-dialog modal-lg">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Evidencia de Entrega</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
        </div>
        <div class="modal-body text-center">
          <img id="imagenZoom" class="img-fluid" src="" alt="Evidencia de entrega">
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/scripts.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>

  <script>
    let todosLosPedidos = [];

    function cargarPedidos() {
      axios.get('http://localhost:8080/api/pedidos/todos')
        .then(res => {
          todosLosPedidos = res.data;
          mostrarPedidos(todosLosPedidos);
        });
    }

    function mostrarPedidos(pedidos) {
      const contenedor = document.getElementById('tablaVentas');
      contenedor.innerHTML = '';

      pedidos.forEach(p => {
        const productos = p.productos ? p.productos.join('<br>') : '';
        const evidenciaImg = p.evidenciaEntrega ?
          `<img src='http://localhost:8080/api/pedidos/imagen-evidencia/${p.idCompra}' class='img-evidencia' onclick='verZoom(${p.idCompra})'/>`
          : 'No disponible';

        contenedor.innerHTML += `
          <tr>
            <td>${p.nombreCompleto || '-'}</td>
            <td>${p.fecha || '-'}</td>
            <td>${productos}</td>
            <td>${p.direccion || '-'}</td>
            <td>${p.metodoPago || '-'}</td>
            <td>${p.correo || '-'}</td>
            <td>${p.estado || '-'}</td>
            <td>${p.fechaEntregaDeseada || '-'}</td>
            <td>${evidenciaImg}</td>
          </tr>
        `;
      });
    }

    function filtrar(estado) {
      if (estado === 'todos') {
        mostrarPedidos(todosLosPedidos);
      } else {
        const filtrados = todosLosPedidos.filter(p => p.estado === estado);
        mostrarPedidos(filtrados);
      }
    }

    function verZoom(idCompra) {
      const img = document.getElementById('imagenZoom');
      img.src = `http://localhost:8080/api/pedidos/imagen-evidencia/${idCompra}`;
      const modal = new bootstrap.Modal(document.getElementById('zoomModal'));
      modal.show();
    }

    cargarPedidos();

    // Navbar y Sidebar dinámicos
    fetch('includes/navbar-top.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('navbar-top').innerHTML = html;
        setTimeout(() => {
          const toggleBtn = document.getElementById('sidebarToggle');
          if (toggleBtn) toggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('sb-sidenav-toggled');
          });
        }, 100);
      });

    fetch('includes/sidebar.html')
      .then(res => res.text())
      .then(html => {
        document.getElementById('layoutSidenav_nav').innerHTML = html;
      });
  </script>
</body>

</html>
